# Pi-Gaze settings (/etc/pigaze/pigaze.conf). Restart after editing:
#   sudo systemctl restart pigaze
# Every key is optional; the values below are the defaults.

# --- camera (rpicam-vid) ---
width = 2304              # multiple of 64; 2304x1296 is the Camera Module 3 binned full-view mode
height = 1296
fps = 30
shutter_us = 0            # 0 = auto exposure; e.g. 8000 for a fixed 8 ms with strong IR
gain = 0                  # 0 = auto
lens_position = 1.7       # focus in dioptres = 1 / distance in metres (1.7 = 60 cm); -1 = autofocus
camera_extra =            # anything else for rpicam-vid, e.g. --roi 0.2,0.2,0.6,0.6

# --- eye detection (pixels at the camera resolution above) ---
eye_roi = 120             # eye window size
pupil_min_r = 2.0
pupil_max_r = 22
glint_min = 170           # glints (IR LED reflections) are at least this bright ...
glint_delta = 60          # ... and this much brighter than their surroundings
glint_max_area = 80       # bigger bright spots = glasses / lamp reflections, ignored
min_confidence = 0.35
ipd_min_frac = 0.03       # distance between the eyes as a fraction of the frame width
ipd_max_frac = 0.25
lost_frames = 12          # frames an eye may vanish (blink) before it is searched again
search_every = 3

# --- calibration ---
calib_file = /var/lib/pigaze/calibration.txt
auto_calibrate = 1        # calibrate by itself on first start once your eyes are seen
calib_margin = 0.1        # 9 points at 10 % .. 90 % of the screen
calib_settle_s = 0.9
calib_collect_s = 1.0
calib_max_rms = 0.08      # reject a calibration worse than 8 % of the screen

# --- cursor ---
filter_min_cutoff = 0.6   # lower = steadier cursor, more lag
filter_beta = 2.0         # higher = faster reaction to big eye jumps
dwell_click = 0           # 1 = click when the gaze rests on one spot
dwell_time_s = 1.2
dwell_radius = 0.025

# --- CH9329 (UART0 on GPIO14/15) ---
hid_enabled = 1
hid_device = /dev/ttyAMA0
hid_baud = 9600

# --- debug page (shows your face: keep it on localhost, open via an SSH tunnel) ---
http_port = 8080          # 0 = off
http_bind = 127.0.0.1
log_interval_s = 5
